<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Pacientes</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Gestión de Pacientes</h1>
    <button id="theme-toggle" aria-label="Cambiar tema">🌓</button>
    <button id="voice-search-toggle" aria-label="Buscar por voz">🎤</button>
  </header>

  <section id="controls">
    <!-- Búsqueda y filtros -->
    <input type="search" id="search-input" placeholder="Buscar pacientes…" aria-label="Buscar pacientes" />
    <span id="result-count" aria-live="polite"></span>
    <button id="clear-filters">Limpiar filtros</button>
    <button id="show-favorites-btn">Filtrar Favoritos</button>
    <div id="filters">
      <label>Hospital:
        <select id="filter-hospital"><option value="">Todos</option></select>
      </label>
      <label>Silla de ruedas:
        <select id="filter-wheelchair">
          <option value="">Todos</option>
          <option value="true">Sí</option>
          <option value="false">No</option>
        </select>
      </label>
      <label>Consulta:
        <select id="filter-consult"><option value="">Todos</option></select>
      </label>
    </div>

    <!-- Ordenamiento -->
    <label>Ordenar:
      <select id="sort-select">
        <option value="nombre-asc">Nombre A→Z</option>
        <option value="nombre-desc">Nombre Z→A</option>
        <option value="fecha-desc">Fecha reciente</option>
        <option value="fecha-asc">Fecha antigua</option>
        <option value="pueblo-asc">Pueblo A→Z</option>
        <option value="pueblo-desc">Pueblo Z→A</option>
      </select>
    </label>

    <!-- Acciones masivas y deshacer -->
    <button id="bulk-delete" disabled>Eliminar seleccionados</button>
    <button id="undo-btn" disabled>Deshacer</button>

    <!-- Export/Import -->
    <button id="export-csv">Exportar CSV</button>
    <button id="export-excel">Exportar Excel</button>
    <input type="file" id="import-file" accept=".csv,application/json" aria-label="Importar datos" />

    <!-- Favoritos -->
    <button id="show-favorites">Mostrar Favoritos</button>
  </section>

  <!-- Contenedor de tarjetas de paciente -->
  <main id="patient-container" aria-live="polite"></main>

  <!-- Paginación -->
  <nav id="pagination"></nav>

  <!-- Gráfico de estadísticas -->
  <canvas id="stats-chart" role="img" aria-label="Gráficos de estadísticas"></canvas>

  <!-- Modales y Toasts -->
  <div id="modal" role="dialog" aria-modal="true" hidden></div>
  <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <!-- Librerías externas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart.js docs: https://www.chartjs.org/docs/latest/ -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script> <!-- SheetJS: https://github.com/SheetJS/sheetjs -->
  <!-- Módulo principal -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
